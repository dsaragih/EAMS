condition_name: pointcloud_baseline
pre_transforms:
  - normals

normalize: true
n_points: 2048
train_transforms:
  - _target_: data.transforms.transforms.PointCloudSample
    n_points: ${...n_points}
    sample_mode_train: random
    sample_mode_eval: random
    sample_with_replacement_train: true
    sample_with_replacement_eval: true
    normalize: ${...normalize}
    scale_low: 0.8
    scale_high: 1.25
    shift_range: 0.1
    include_normals: true
val_transforms:
  - _target_: data.transforms.transforms.PointCloudSample
    n_points: ${...n_points}
    sample_mode_train: random
    sample_mode_eval: random
    sample_with_replacement_train: true
    sample_with_replacement_eval: true
    normalize: ${...normalize}
    scale_low: 1.0
    scale_high: 1.0
    shift_range: 0.0
    include_normals: true
test_transforms:
  - _target_: data.transforms.transforms.PointCloudSample
    n_points: ${...n_points}
    sample_mode_train: random
    sample_mode_eval: random
    sample_with_replacement_train: true
    sample_with_replacement_eval: true
    normalize: ${...normalize}
    scale_low: 1.0
    scale_high: 1.0
    shift_range: 0.0
    include_normals: true