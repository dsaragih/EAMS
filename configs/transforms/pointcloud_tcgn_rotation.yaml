defaults:
  - pointcloud_baseline
  - _self_

condition_name: pointcloud_tcgn_rotation
train_transforms:
  - _target_: data.transforms.transforms.RandomTCGNRotationMesh
  - _target_: data.transforms.transforms.PointCloudSample
    n_points: ${...n_points}
    sample_mode_train: random
    sample_mode_eval: random
    sample_with_replacement_train: true
    sample_with_replacement_eval: true
    normalize: ${...normalize}
    scale_low: 0.8
    scale_high: 1.25
    shift_range: 0.1
    include_normals: true
