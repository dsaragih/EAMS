# IntrA: vertex boundary DoU + embedding contrastive loss.
# Latent-coordinate regularization remains available but is disabled by default.

loss_dict:
  pred: ${losses.vertex_bdou}
  embedding: ${losses.contrastive_boundary}
  latent_regularization: ${losses.latent_coordinate_regularization}

loss_coefficients:
  pred: 1.0
  embedding: 1.0
  latent_regularization: 0.0
