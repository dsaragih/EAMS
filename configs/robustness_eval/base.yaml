enabled: true
include_baseline: true
fail_on_error: false
results_subdir: robustness

variants:
  - condition_name: rotation_z_15deg
    test_transforms:
      - _target_: data.transforms.transforms.RotateMesh
        degrees: 15.0
        axis: z
  - condition_name: rotation_z_40deg
    test_transforms:
      - _target_: data.transforms.transforms.RotateMesh
        degrees: 40.0
        axis: z